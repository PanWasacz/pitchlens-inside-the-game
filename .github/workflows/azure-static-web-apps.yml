# Deploys web/ (studio) and api/ (explain agents) to Azure Static Web Apps.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (deployment token of
# the Static Web App, see docs/deploy.md). Until it is set the deploy step is skipped.

name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Agent tests
        working-directory: api
        run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice
        if: env.SWA_TOKEN == ''
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set yet, skipping the deploy."
      - name: Build and deploy
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: dist
